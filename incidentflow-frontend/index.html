<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IncidentFlow - Incidents</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">IF</div>
      <div>
        <h1>IncidentFlow</h1>
        <p class="subtitle">Incident Management Dashboard</p>
      </div>
    </div>
  </header>

  <main class="container">

    <section class="card">
      <div class="createCard">
  <h2 class="sectionTitle">Create Incident</h2>

  <form id="createForm" class="formGrid">
    <label>
      Title <span class="req">*</span>
      <input id="titleInput" type="text" placeholder="e.g., VPN not connecting" maxlength="120" />
    </label>

    <label>
      Priority <span class="req">*</span>
      <select id="priorityInput">
        <option value="">Select</option>
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>
      </select>
    </label>

    <label class="full">
      Description <span class="req">*</span>
      <textarea id="descInput" rows="3" placeholder="Describe the issue..." maxlength="1000"></textarea>
    </label>

    <div class="actions full">
      <button type="submit" class="btn">Create</button>
      <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
      <span id="formMsg" class="formMsg"></span>
    </div>
  </form>

  <hr class="divider" />
</div>
<div class="assignCard">
  <h2 class="sectionTitle">Assign Incident</h2>

  <form id="assignForm" class="formGrid">
    <label>
      Incident ID <span class="req">*</span>
      <input id="assignIncidentId" type="number" min="1" placeholder="e.g., 6" />
    </label>

    <label>
      Assign To <span class="req">*</span>
      <input id="assignTo" type="text" placeholder="e.g., anuhya" maxlength="60" />
    </label>

    <label>
      User Role <span class="req">*</span>
      <select id="assignRole">
        <option value="">Select</option>
        <option value="ADMIN">ADMIN</option>
        <option value="SUPPORT">SUPPORT</option>
        <option value="EMPLOYEE">EMPLOYEE</option>
      </select>
    </label>

    <div class="actions full">
      <button type="submit" class="btn">Assign</button>
      <button type="button" id="assignClearBtn" class="btn btn-secondary">Clear</button>
      <span id="assignMsg" class="formMsg"></span>
    </div>
  </form>

  <hr class="divider" />
</div>
<div class="statusCard">
  <h2 class="sectionTitle">Update Incident Status</h2>

  <form id="statusForm" class="formGrid">
    <label>
      Incident ID <span class="req">*</span>
      <input id="statusIncidentId" type="number" min="1" placeholder="e.g., 6" />
    </label>

    <label>
      New Status <span class="req">*</span>
      <select id="newStatus">
        <option value="">Select</option>
        <option value="IN_PROGRESS">IN_PROGRESS</option>
        <option value="RESOLVED">RESOLVED</option>
        <option value="CLOSED">CLOSED</option>
      </select>
    </label>

    <label>
      User Role <span class="req">*</span>
      <select id="statusRole">
        <option value="">Select</option>
        <option value="ADMIN">ADMIN</option>
        <option value="SUPPORT">SUPPORT</option>
      </select>
    </label>

    <div class="actions full">
      <button type="submit" class="btn">Update Status</button>
      <button type="button" id="statusClearBtn" class="btn btn-secondary">Clear</button>
      <span id="statusMsg" class="formMsg"></span>
    </div>
  </form>

  <hr class="divider" />
</div>

      <div class="toolbar">
        <div class="filters">
          <label>
            Status
            <select id="statusFilter">
              <option value="">All</option>
              <option value="OPEN">OPEN</option>
              <option value="IN_PROGRESS">IN_PROGRESS</option>
              <option value="RESOLVED">RESOLVED</option>
              <option value="CLOSED">CLOSED</option>
            </select>
            
          </label>

          <label>
            Priority
            <select id="priorityFilter">
              <option value="">All</option>
              <option value="LOW">LOW</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="HIGH">HIGH</option>
            </select>
          </label>

          <label>
            Sort
            <select id="sortSelect">
              <option value="createdAt,desc">Created (Newest)</option>
              <option value="createdAt,asc">Created (Oldest)</option>
              <option value="priority,asc">Priority (Low → High)</option>
              <option value="priority,desc">Priority (High → Low)</option>
            </select>
          </label>

          <button id="applyBtn" class="btn">Apply</button>
          <button id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>

        <div class="pageControls">
          <label>
            Page Size
            <select id="pageSize">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
            </select>
          </label>

          <button id="prevBtn" class="btn btn-secondary">Prev</button>
          <span id="pageInfo" class="pageInfo">Page 1 of 1</span>
          <button id="nextBtn" class="btn btn-secondary">Next</button>
        </div>
      </div>

      <div id="alert" class="alert hidden"></div>

      <div class="tableWrap">
        <table class="table">
          <thead>
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Priority</th>
    <th>Status</th>
    <th>Assigned To</th>
    <th>Created</th>
    <th>Actions</th>
  </tr>
</thead>

          <tbody id="incidentsBody">
            <!-- rows injected by JS -->
          </tbody>
        </table>
      </div>

      <div id="loading" class="loading hidden">Loading incidents...</div>
      <div id="empty" class="empty hidden">No incidents found for the selected filters.</div>
    </section>

  </main>
  <!-- Incident Details Modal -->
<div id="incidentModal" class="modal hidden">
  <div class="modalContent">
    <div class="modalHeader">
      <h3>Incident Details</h3>
      <button id="closeModalBtn" class="btn btn-secondary btn-sm" type="button">Close</button>
    </div>

    <div id="modalBody" class="modalBody"></div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal hidden">
  <div class="modalContent">
    <div class="modalHeader">
      <h3>Confirm Delete</h3>
      <button id="closeDeleteBtn" class="btn btn-secondary btn-sm" type="button">Close</button>
    </div>

    <div class="modalBody">
      <p id="deleteText"></p>

      <label style="margin-top:10px; display:block;">
        Admin Role Required
        <select id="deleteRole">
          <option value="">Select</option>
          <option value="ADMIN">ADMIN</option>
          <option value="SUPPORT">SUPPORT</option>
        </select>
      </label>

      <div class="actions" style="margin-top:14px;">
        <button id="confirmDeleteBtn" class="btn" type="button">Delete</button>
        <button id="cancelDeleteBtn" class="btn btn-secondary" type="button">Cancel</button>
      </div>
    </div>
  </div>
</div>
<!-- Edit Incident Modal -->
<div id="editModal" class="modal hidden">
  <div class="modalContent">
    <div class="modalHeader">
      <h3>Edit Incident</h3>
      <button id="closeEditBtn" class="btn btn-secondary btn-sm" type="button">Close</button>
    </div>

    <div class="modalBody">
      <input type="hidden" id="editId">

      <label>Title</label>
      <input type="text" id="editTitle">

      <label>Description</label>
      <textarea id="editDescription"></textarea>

      <label>Priority</label>
      <select id="editPriority">
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>
      </select>

      <label>Role</label>
      <select id="editRole">
        <option value="">Select</option>
        <option value="ADMIN">ADMIN</option>
        <option value="SUPPORT">SUPPORT</option>
      </select>

      <div class="actions" style="margin-top:12px;">
        <button id="saveEditBtn" class="btn">Save</button>
        <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div id="toastContainer" class="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
